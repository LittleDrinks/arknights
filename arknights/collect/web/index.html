<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>真人示范采集</title><link rel="stylesheet" href="/collect/style.css"><body><main><nav><a href="/">原游戏</a> · <a href="/evaluations">评测队列</a> · <a href="/collect">采集列表</a></nav><h1>真人示范采集</h1><p>正常联机游玩，保存本人操作与战斗录像。开始前每位玩家须在本页明确同意记录。仅支持原版房间，录像来源为 recorded-events。</p><div id="error" role="alert"></div><p id="feedback" role="status" aria-live="polite"></p><section id="create"><input id="label" placeholder="采集批次名称"><button id="create-button">创建采集批次</button></section><section id="list"></section><section id="detail" hidden><h2 id="heading"></h2><p id="invite"></p><label><input type="checkbox" id="consent">我同意保存本局及本席操作、可见状态和战斗，供复核、标注及示范集导出。不要填写真实姓名。</label><p><button id="join">同意并进入原游戏</button> <button id="refresh">刷新场次</button></p><div id="matches"></div><div id="timeline"></div><form id="annotation" hidden><h3>标注事件区间</h3><label>开始事件<select id="start"></select></label><label>结束事件<select id="end"></select></label><label>核心盟约<input id="core"></label><label>附加盟约<input id="support"></label><label>阶段<select id="stage"><option value="prep">准备</option><option value="stack">叠层</option><option value="convert">转战力</option><option value="combat">战斗</option><option value="other">其他</option></select></label><label>质量<select id="quality"><option value="usable">可用</option><option value="great">精彩</option><option value="mistake">失误</option><option value="uncertain">不确定</option></select></label><label>说明（可选）<input id="note" maxlength="1000"></label><label>署名<input id="author" value="organizer" maxlength="80"></label><button>追加标注修订</button><button id="new-annotation" type="button">新标注</button></form><div id="revisions"></div><p id="export-controls"><select id="profile"><option value="human-reviewed">已审阅片段</option><option value="all-human">全部已确认人工操作</option></select><button id="export">导出 DatasetRef</button></p><p id="dataset-summary"></p><details id="dataset-details"><summary>数据质量与 DatasetRef 详情</summary><pre id="dataset"></pre></details></section></main><script type="module" src="/collect/app.mjs"></script></body></html>
