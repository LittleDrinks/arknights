<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>对局记录</title>
<link rel="stylesheet" href="/collect/library.css">
<main><nav><a href="/">← 返回游戏</a><span>STRONGHOLD / RECORDS</span></nav><header><div><p class="eyebrow">作战档案</p><h1>对局记录</h1><p class="muted">房间自动记录，胜负与中断局均保留。选择席位，在原生战场中回看操作与战斗。</p></div><button id="refresh">刷新记录</button></header><p id="count" class="muted"></p><div id="error" role="alert"></div><div id="rooms"></div>
<section id="detail" hidden><div class="detail-head"><div><p class="eyebrow">操作与标注</p><h2 id="heading"></h2></div><a id="replay" class="primary">▶ 原生回放</a></div><details><summary>查看操作明细</summary><div id="timeline"></div></details>
<form id="annotation"><h3>标注操作区间</h3><div class="form-grid"><label>开始<select id="start"></select></label><label>结束<select id="end"></select></label><label>核心盟约<input id="core"></label><label>附加盟约<input id="support"></label><label>阶段<select id="stage"><option value="prep">准备</option><option value="stack">叠层</option><option value="convert">转战力</option><option value="combat">战斗</option><option value="other">其他</option></select></label><label>质量<select id="quality"><option value="usable">可用</option><option value="great">精彩</option><option value="mistake">失误</option><option value="uncertain">不确定</option></select></label><label class="note">说明<input id="note" maxlength="1000"></label></div><button class="primary">保存标注</button></form><p id="feedback" role="status"></p><div id="revisions"></div></section></main>
<script type="module" src="/collect/library.mjs"></script>
</html>
