<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>对局记录</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#0c1617;color:#dce9e7}main{max-width:1100px;margin:32px auto;padding:20px}a{color:#57dbb9}button,input,select{font:inherit;padding:8px;margin:5px;background:#142725;color:inherit;border:1px solid #4a7167}button{cursor:pointer}section{border:1px solid #36564c;padding:16px;margin:16px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #29423b}label{display:block}#error{color:#ffa58a;white-space:pre-wrap}#timeline{max-height:430px;overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere}button:disabled{opacity:.5}
</style>
<main><a href="/">返回游戏</a><h1>对局记录</h1><p>创建房间即自动采集。这里查看本浏览器参与的房间、回放和标注；胜负、中断局都会保留。</p><button id="refresh">刷新记录</button><div id="error" role="alert"></div><div id="rooms"></div>
<section id="detail" hidden><h2 id="heading"></h2><a id="replay">回放本席操作与战斗</a><div id="timeline"></div>
<form id="annotation"><h3>标注操作区间</h3><label>开始<select id="start"></select></label><label>结束<select id="end"></select></label><label>核心盟约<input id="core"></label><label>附加盟约<input id="support"></label><label>阶段<select id="stage"><option value="prep">准备</option><option value="stack">叠层</option><option value="convert">转战力</option><option value="combat">战斗</option><option value="other">其他</option></select></label><label>质量<select id="quality"><option value="usable">可用</option><option value="great">精彩</option><option value="mistake">失误</option><option value="uncertain">不确定</option></select></label><label>说明<input id="note" maxlength="1000"></label><button>保存标注</button></form><p id="feedback" role="status"></p><div id="revisions"></div></section></main>
<script type="module" src="/collect/library.mjs"></script>
</html>
